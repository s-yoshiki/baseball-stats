name: Publish SQLite

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Player scope"
        type: choice
        options: [active, all]
        default: active
        required: true
      delay:
        description: "Delay between requests in milliseconds"
        type: string
        default: "300"
        required: true

permissions:
  # db-latest Release の作成・更新（asset upload含む）に contents: write が必要。
  contents: write

concurrency:
  group: publish-sqlite
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scrape and build SQLite snapshot
        run: >-
          pnpm --filter @repo/parser run scrape --
          --scope ${{ inputs.scope || 'active' }}
          --delay ${{ inputs.delay || '300' }}
          --debug

      - name: Validate SQLite snapshot
        run: >-
          pnpm --filter @repo/parser run validate-sqlite --
          --db ../../data/sqlite/data.sqlite
          --json-out ../../release/counts.json

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseball-stats-sqlite
          path: data/sqlite/data.sqlite
          if-no-files-found: error
          retention-days: 14

      # ここから db-latest Release の公開。artifactはretention 14日かつ匿名DLに
      # tokenが要るため、npb-analysisからの匿名取得先はRelease assetに一本化する。
      - name: Build release metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RELEASE_SCOPE: ${{ inputs.scope || 'active' }}
        run: >-
          pnpm --filter @repo/parser run build-release-metadata --
          --counts ../../release/counts.json
          --out ../../release/metadata.json
          --source-sha "$SOURCE_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --scope "$RELEASE_SCOPE"

      - name: Compute SQLite checksum
        run: |
          set -euo pipefail
          mkdir -p release
          # sha256sumの実行ディレクトリをdata/sqliteにして、チェックサムファイルの
          # 対象名がdata.sqlite（asset名と同じ）になるようにする。
          (cd data/sqlite && sha256sum data.sqlite) > release/data.sqlite.sha256
          cat release/data.sqlite.sha256

      - name: Publish db-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="db-latest"

          players="$(jq -r '.players' release/metadata.json)"
          batting_rows="$(jq -r '.batting_rows' release/metadata.json)"
          pitching_rows="$(jq -r '.pitching_rows' release/metadata.json)"

          notes="$(cat <<NOTES
          Rolling snapshot of the published SQLite (\`data/sqlite/data.sqlite\`).
          This tag is force-updated on every publish; it does not keep history.

          - Source commit: ${SOURCE_SHA}
          - Generated by: ${RUN_URL}
          - Players: ${players}
          - Batting rows: ${batting_rows}
          - Pitching rows: ${pitching_rows}
          NOTES
          )"

          # 初回はReleaseが存在しないため、view で存在確認してcreate/editを出し分ける。
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$REPO" --target main --title "$tag" --notes "$notes"
          else
            gh release create "$tag" --repo "$REPO" --target main --title "$tag" --notes "$notes"
          fi

          # rolling tagなので既存assetを --clobber で上書きする。
          gh release upload "$tag" \
            data/sqlite/data.sqlite \
            release/data.sqlite.sha256 \
            release/metadata.json \
            --repo "$REPO" \
            --clobber

      - name: Check cross-repository dispatch secret
        id: dispatch-secret
        env:
          DISPATCH_TOKEN: ${{ secrets.NPB_ANALYSIS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::NPB_ANALYSIS_DISPATCH_TOKEN is not configured; skipping npb-analysis notification"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify npb-analysis
        if: steps.dispatch-secret.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NPB_ANALYSIS_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "s-yoshiki",
              repo: "npb-analysis",
              event_type: "baseball-stats-updated",
              client_payload: {
                source_repo: context.repo.owner + "/" + context.repo.repo,
                source_sha: context.sha,
                release_tag: "db-latest",
              },
            });
