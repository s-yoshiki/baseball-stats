name: Publish SQLite

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Player scope"
        type: choice
        options: [active, all]
        default: active
        required: true
      delay:
        description: "Delay between requests in milliseconds"
        type: string
        default: "300"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-sqlite
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scrape and build SQLite snapshot
        run: >-
          pnpm --filter @repo/parser run scrape --
          --scope ${{ inputs.scope || 'active' }}
          --delay ${{ inputs.delay || '300' }}
          --debug

      - name: Validate SQLite snapshot
        run: >-
          pnpm --filter @repo/parser run validate-sqlite --
          --db ../../data/sqlite/data.sqlite

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseball-stats-sqlite
          path: data/sqlite/data.sqlite
          if-no-files-found: error
          retention-days: 14

      - name: Check cross-repository dispatch secret
        env:
          DISPATCH_TOKEN: ${{ secrets.NPB_ANALYSIS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "NPB_ANALYSIS_DISPATCH_TOKEN is not configured" >&2
            exit 1
          fi

      - name: Notify npb-analysis
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NPB_ANALYSIS_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "s-yoshiki",
              repo: "npb-analysis",
              event_type: "baseball-stats-updated",
              client_payload: {
                source_repo: context.repo.owner + "/" + context.repo.repo,
                source_sha: context.sha,
                source_run_id: Number(context.runId),
                artifact_name: "baseball-stats-sqlite",
              },
            });
