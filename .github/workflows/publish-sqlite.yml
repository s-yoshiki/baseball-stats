name: Publish SQLite

on:
  workflow_dispatch:
    inputs:
      # 引退選手を含む全選手（scope=all、約8000選手）のフル取得はこの
      # workflowのtimeout-minutes: 20には収まらないため許可しない。フル取得は
      # Daily scrapeをworkflow_dispatchでscope=all指定して手動実行する
      # （timeout-minutes: 90）。このworkflowは現役ロースターの再公開専用とする。
      scope:
        description: "Player scope (full scrape is done via Daily scrape)"
        type: choice
        options: [active]
        default: active
        required: true
      delay:
        description: "Delay between requests in milliseconds"
        type: string
        default: "300"
        required: true

permissions:
  # チェックアウトとPages成果物のビルドにはcontents: readで十分。
  # Pagesへのデプロイ権限（pages: write / id-token: write）はdeployジョブ側で
  # 必要な範囲だけ個別に付与する。
  contents: read

concurrency:
  group: publish-sqlite
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scrape and build SQLite snapshot
        run: >-
          pnpm --filter @repo/parser run scrape --
          --scope ${{ inputs.scope || 'active' }}
          --delay ${{ inputs.delay || '300' }}
          --debug

      - name: Validate SQLite snapshot
        run: >-
          pnpm --filter @repo/parser run validate-sqlite --
          --db ../../data/sqlite/data.sqlite
          --json-out ../../release/counts.json

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseball-stats-sqlite
          path: data/sqlite/data.sqlite
          if-no-files-found: error
          retention-days: 14

      - name: Build release metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RELEASE_SCOPE: ${{ inputs.scope || 'active' }}
        run: >-
          pnpm --filter @repo/parser run build-release-metadata --
          --counts ../../release/counts.json
          --out ../../release/metadata.json
          --source-sha "$SOURCE_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --scope "$RELEASE_SCOPE"

      - name: Compute SQLite checksum
        run: |
          set -euo pipefail
          mkdir -p release
          # sha256sumの実行ディレクトリをdata/sqliteにして、チェックサムファイルの
          # 対象名がdata.sqlite（asset名と同じ）になるようにする。
          (cd data/sqlite && sha256sum data.sqlite) > release/data.sqlite.sha256
          cat release/data.sqlite.sha256

      # ここから公開用サイト（GitHub Pages）の構築。Actions artifactは匿名DLに
      # tokenが要るため、npb-analysisからの匿名取得先はGitHub Pagesに一本化する。
      # Pagesの有効化自体はgithub-terraformリポジトリのTerraformで管理しており、
      # ここではPagesが有効化済みであることを前提にする（configure-pagesの
      # enablement機能は使わない）。
      - name: Build Pages site
        run: |
          set -euo pipefail
          site_dir="site"
          rm -rf "$site_dir"
          mkdir -p "$site_dir"

          cp data/sqlite/data.sqlite "$site_dir/data.sqlite"
          cp release/data.sqlite.sha256 "$site_dir/data.sqlite.sha256"
          cp release/metadata.json "$site_dir/metadata.json"

          # metadata.jsonの値をそのままページに埋め込む。値はこのジョブが
          # 直前に生成したファイルから読むだけなので、外部入力によるインジェ
          # クションの心配はない。
          source_sha="$(jq -r '.source_sha' release/metadata.json)"
          generated_at="$(jq -r '.generated_at' release/metadata.json)"
          scope="$(jq -r '.scope' release/metadata.json)"
          players="$(jq -r '.players' release/metadata.json)"
          batting_rows="$(jq -r '.batting_rows' release/metadata.json)"
          pitching_rows="$(jq -r '.pitching_rows' release/metadata.json)"

          cat > "$site_dir/index.html" <<HTML
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>baseball-stats public dataset</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.6; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
            h1 { font-size: 1.4rem; }
            table { border-collapse: collapse; margin: 1rem 0; }
            th, td { text-align: left; padding: 0.25rem 0.75rem 0.25rem 0; border-bottom: 1px solid #ddd; }
            code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 3px; }
            footer { margin-top: 2rem; font-size: 0.85rem; color: #555; }
          </style>
          </head>
          <body>
          <h1>baseball-stats 公開データセット</h1>
          <p>NPB公式サイト（npb.jp）の公開選手データを取得・整形したSQLiteデータベースです。<a href="https://github.com/s-yoshiki/baseball-stats">baseball-stats</a> のGitHub Actionsワークフローが生成し、このページへ再デプロイします。</p>

          <h2>ファイル</h2>
          <ul>
            <li><a href="data.sqlite">data.sqlite</a> — 公開用SQLite本体</li>
            <li><a href="data.sqlite.sha256">data.sqlite.sha256</a> — <code>sha256sum</code>形式のチェックサム</li>
            <li><a href="metadata.json">metadata.json</a> — 由来と行数を記録したメタデータ</li>
          </ul>

          <h2>最新の生成情報</h2>
          <table>
            <tr><th>生成日時</th><td>${generated_at}</td></tr>
            <tr><th>取得範囲 (scope)</th><td>${scope}</td></tr>
            <tr><th>選手数</th><td>${players}</td></tr>
            <tr><th>打撃成績行数</th><td>${batting_rows}</td></tr>
            <tr><th>投手成績行数</th><td>${pitching_rows}</td></tr>
            <tr><th>ソースコミット</th><td><code>${source_sha}</code></td></tr>
          </table>

          <footer>
            <p>出典: npb.jp（NPB公式サイト）。このデータセットは baseball-stats のGitHub Actionsにより毎回再生成され、このページも都度上書きデプロイされます（過去バージョンは保持されません）。</p>
          </footer>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 同じPagesサイトへ複数ワークフロー（daily-scrape / publish-sqlite）から
    # デプロイし得るため、専用のconcurrencyグループで直列化する。ワークフロー
    # 全体のconcurrency（publish-sqlite）とは独立して、デプロイ処理だけを
    # 直列化する。
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # npb-analysisはpush(main)/schedule/workflow_dispatchで自走するため、
      # ここからのrepository_dispatch通知は行わない。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
