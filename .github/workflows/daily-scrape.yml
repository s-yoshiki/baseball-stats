# baseball-statsはnpb.jpの取得層に専業化し、raw SQLite（raw.sqlite）だけを
# 生成してこのリポジトリのGitHub Pagesへ公開する。加工済み（published）SQLiteの
# 生成・公開はnpb-analysis側へ移した（ADR 0007を参照）。npb-analysisはデプロイ時に
# このPagesサイトからraw.sqliteを取得し、自スキーマへ変換する。
#
# 日次自動実行（schedule）は、npb-analysisへの統合作業中は一時的に無効化されて
# いた（workflow_dispatchのみ受け付ける状態だった）。GitHub Pagesへのraw.sqlite
# 初回publishが成功し、npb-analysisのDeployがこのPagesサイトを参照して起動する
# 経路に切り替わったため、scheduleを復活させる。
#
# 下流タイミング依存: npb-analysisのDeployは cron "0 20 * * *"（05:00 JST）で、
# このリポジトリのGitHub PagesからPublishされたraw.sqliteを取得する。この
# workflowは03:00 JST開始・timeout-minutes: 90であり、遅くとも04:30 JSTには
# scrapeジョブが完了し、続くdeploy-pagesジョブがPagesへpublishする。つまり
# npb-analysisのDeployが起動する05:00 JSTより前に新しいraw.sqliteが揃っている
# 前提でスケジュールを組んでいる。開始時刻（cron）やtimeout-minutesを変更して
# この時間関係を崩す場合は、npb-analysis側のDeploy cronも合わせて見直すこと。
name: Daily scrape

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      scope:
        description: "Player scope (daily updates active and new players)"
        type: choice
        options:
          - daily
          - active
          - all
        default: daily
        required: true
      limit:
        description: "Optional player limit for a small verification run"
        type: string
        default: ""
        required: false
      kana_limit:
        description: "Optional kana-page limit for a small verification run"
        type: string
        default: ""
        required: false
      delay:
        description: "Delay between requests in milliseconds"
        type: string
        default: "300"
        required: true

permissions:
  # チェックアウトとPages成果物のビルドにはcontents: readで十分。
  # Pagesへのデプロイ権限（pages: write / id-token: write）はdeployジョブ側で
  # 必要な範囲だけ個別に付与する。raw SQLiteの復元はGitHub Pagesからの匿名
  # 取得のみで完結するため（gh run list / gh run downloadは使わない）、
  # actions: readは不要。
  contents: read

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore previous raw SQLite
        env:
          SCRAPE_SCOPE: ${{ inputs.scope || 'daily' }}
        run: |
          set -euo pipefail
          mkdir -p data/raw

          # 日次差分の基準は、このworkflow自身が公開したGitHub Pages上の
          # raw.sqliteにする。Actions artifact（retention 30日）と違って
          # 寿命の制約を受けない——Pages上のraw.sqliteは直近のpublishで常に
          # 上書きされているため、常に「自分が最後にpublishしたもの」を
          # 基準にできる。
          pages_url="https://s-yoshiki.github.io/baseball-stats/raw.sqlite"
          pages_ok=false
          if curl -fL --retry 5 -H "Cache-Control: no-cache" \
              "$pages_url" -o data/raw/raw.sqlite; then
            # `|| true` を付けて、.sha256側だけが取得に失敗した場合でも
            # set -eでジョブ全体を落とさず、下のチェックサム不一致処理に委ねる。
            expected="$(curl -fsL --retry 5 -H "Cache-Control: no-cache" \
              "${pages_url}.sha256" | awk '{print $1}' || true)"
            actual="$(cd data/raw && sha256sum raw.sqlite | awk '{print $1}')"
            if [ -n "$expected" ] && [ "$expected" = "$actual" ]; then
              echo "Restored the previous raw SQLite from GitHub Pages (sha256 $actual)."
              pages_ok=true
            else
              echo "Checksum mismatch after downloading from Pages (expected '$expected', got '$actual'); discarding."
              rm -f data/raw/raw.sqlite
            fi
          else
            echo "GitHub Pages fetch of raw.sqlite failed."
            rm -f data/raw/raw.sqlite
          fi

          if [ "$pages_ok" = true ]; then
            exit 0
          fi

          if [ "$SCRAPE_SCOPE" = "all" ]; then
            echo "No usable raw SQLite found on GitHub Pages; starting a full baseline scrape (scope=all)."
            exit 0
          fi

          echo "::error::No usable raw SQLite found on GitHub Pages, and scope is '$SCRAPE_SCOPE' (not 'all'). Refusing to run to avoid an unintended full scrape; re-run with scope=all to rebuild the baseline."
          exit 1

      - name: Scrape and build raw SQLite
        env:
          SCRAPE_SCOPE: ${{ inputs.scope || 'daily' }}
          SCRAPE_LIMIT: ${{ inputs.limit || '' }}
          SCRAPE_KANA_LIMIT: ${{ inputs.kana_limit || '' }}
          SCRAPE_DELAY: ${{ inputs.delay || '300' }}
        run: |
          args=(--scope "$SCRAPE_SCOPE" --delay "$SCRAPE_DELAY" --debug)
          if [ -n "$SCRAPE_LIMIT" ]; then args+=(--limit "$SCRAPE_LIMIT"); fi
          if [ -n "$SCRAPE_KANA_LIMIT" ]; then args+=(--kana-limit "$SCRAPE_KANA_LIMIT"); fi
          pnpm --filter @repo/parser run scrape -- "${args[@]}"

      - name: Upload raw scrape SQLite
        uses: actions/upload-artifact@v7
        with:
          name: baseball-stats-raw
          path: data/raw/raw.sqlite
          if-no-files-found: error
          retention-days: 30

      - name: Validate raw SQLite
        run: >-
          pnpm --filter @repo/parser run validate-sqlite --
          --db ../../data/raw/raw.sqlite
          --json-out ../../release/counts.json

      - name: Build release metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RELEASE_SCOPE: ${{ inputs.scope || 'daily' }}
        run: >-
          pnpm --filter @repo/parser run build-release-metadata --
          --counts ../../release/counts.json
          --out ../../release/metadata.json
          --source-sha "$SOURCE_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --scope "$RELEASE_SCOPE"

      - name: Compute SQLite checksum
        run: |
          set -euo pipefail
          mkdir -p release
          # sha256sumの実行ディレクトリをdata/rawにして、チェックサムファイルの
          # 対象名がraw.sqlite（asset名と同じ）になるようにする。
          (cd data/raw && sha256sum raw.sqlite) > release/raw.sqlite.sha256
          cat release/raw.sqlite.sha256

      # ここから公開用サイト（GitHub Pages）の構築。Actions artifactは匿名DLに
      # tokenが要るため、npb-analysisからの匿名取得先はGitHub Pagesに一本化する。
      # Pagesの有効化自体はgithub-terraformリポジトリのTerraformで管理しており、
      # ここではPagesが有効化済みであることを前提にする（configure-pagesの
      # enablement機能は使わない）。
      - name: Build Pages site
        run: |
          set -euo pipefail
          site_dir="site"
          rm -rf "$site_dir"
          mkdir -p "$site_dir"

          cp data/raw/raw.sqlite "$site_dir/raw.sqlite"
          cp release/raw.sqlite.sha256 "$site_dir/raw.sqlite.sha256"
          cp release/metadata.json "$site_dir/metadata.json"

          # metadata.jsonの値をそのままページに埋め込む。値はこのジョブが
          # 直前に生成したファイルから読むだけなので、外部入力によるインジェ
          # クションの心配はない。
          source_sha="$(jq -r '.source_sha' release/metadata.json)"
          generated_at="$(jq -r '.generated_at' release/metadata.json)"
          scope="$(jq -r '.scope' release/metadata.json)"
          players="$(jq -r '.players' release/metadata.json)"
          runs="$(jq -r '.runs' release/metadata.json)"

          cat > "$site_dir/index.html" <<HTML
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>baseball-stats raw dataset</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.6; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
            h1 { font-size: 1.4rem; }
            table { border-collapse: collapse; margin: 1rem 0; }
            th, td { text-align: left; padding: 0.25rem 0.75rem 0.25rem 0; border-bottom: 1px solid #ddd; }
            code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 3px; }
            footer { margin-top: 2rem; font-size: 0.85rem; color: #555; }
          </style>
          </head>
          <body>
          <h1>baseball-stats raw データセット</h1>
          <p>NPB公式サイト（<a href="https://npb.jp">npb.jp</a>）の公開選手データをそのまま取得したraw SQLiteデータベースです。加工・派生指標の計算は行っていません。<a href="https://github.com/s-yoshiki/baseball-stats">baseball-stats</a> のGitHub Actionsワークフローが生成し、このページへ再デプロイします。<a href="https://github.com/s-yoshiki/npb-analysis">npb-analysis</a> がデプロイ時にこのraw.sqliteを取得し、アプリ向けに加工したデータベースを生成します。</p>

          <h2>ファイル</h2>
          <ul>
            <li><a href="raw.sqlite">raw.sqlite</a> — raw SQLite本体（スクレイピング結果と取得履歴）</li>
            <li><a href="raw.sqlite.sha256">raw.sqlite.sha256</a> — <code>sha256sum</code>形式のチェックサム</li>
            <li><a href="metadata.json">metadata.json</a> — 由来と規模を記録したメタデータ</li>
          </ul>

          <h2>最新の生成情報</h2>
          <table>
            <tr><th>生成日時</th><td>${generated_at}</td></tr>
            <tr><th>取得範囲 (scope)</th><td>${scope}</td></tr>
            <tr><th>選手数（player_id重複除く）</th><td>${players}</td></tr>
            <tr><th>スクレイプrun数</th><td>${runs}</td></tr>
            <tr><th>ソースコミット</th><td><code>${source_sha}</code></td></tr>
          </table>

          <footer>
            <p>出典: npb.jp（NPB公式サイト）。このデータセットは baseball-stats のGitHub Actionsにより毎回再生成され、このページも都度上書きデプロイされます（過去バージョンは保持されません）。</p>
          </footer>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 同じPagesサイトへ複数ワークフローからデプロイし得るため、専用の
    # concurrencyグループで直列化する。ワークフロー全体のconcurrency
    # （daily-scrape）とは独立して、デプロイ処理だけを直列化する。
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
