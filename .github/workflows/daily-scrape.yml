name: Daily scrape

on:
  schedule:
    # 03:00 JST. Keep the request interval in the command below so the
    # scheduled job is polite to npb.jp.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Player scope (daily updates active and new players)"
        type: choice
        options:
          - daily
          - active
          - all
        default: daily
        required: true
      limit:
        description: "Optional player limit for a small verification run"
        type: string
        default: ""
        required: false
      kana_limit:
        description: "Optional kana-page limit for a small verification run"
        type: string
        default: ""
        required: false
      delay:
        description: "Delay between requests in milliseconds"
        type: string
        default: "300"
        required: true

permissions:
  # db-latest Release の作成・更新（asset upload含む）に contents: write が必要。
  contents: write
  actions: read

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore previous raw SQLite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/raw
          previous_run_id="$(gh run list \
            --workflow daily-scrape.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -z "$previous_run_id" ]; then
            echo "No previous daily raw artifact found; starting a baseline scrape."
            exit 0
          fi
          if ! gh run download "$previous_run_id" \
            --name baseball-stats-raw \
            --dir data/raw; then
            echo "Previous raw artifact is unavailable; starting a baseline scrape."
            rm -f data/raw/raw.sqlite
          fi

      - name: Scrape and build SQLite
        env:
          SCRAPE_SCOPE: ${{ inputs.scope || 'daily' }}
          SCRAPE_LIMIT: ${{ inputs.limit || '' }}
          SCRAPE_KANA_LIMIT: ${{ inputs.kana_limit || '' }}
          SCRAPE_DELAY: ${{ inputs.delay || '300' }}
        run: |
          args=(--scope "$SCRAPE_SCOPE" --delay "$SCRAPE_DELAY" --debug)
          if [ -n "$SCRAPE_LIMIT" ]; then args+=(--limit "$SCRAPE_LIMIT"); fi
          if [ -n "$SCRAPE_KANA_LIMIT" ]; then args+=(--kana-limit "$SCRAPE_KANA_LIMIT"); fi
          pnpm --filter @repo/parser run scrape -- "${args[@]}"

      - name: Upload raw scrape SQLite
        uses: actions/upload-artifact@v4
        with:
          name: baseball-stats-raw
          path: data/raw/raw.sqlite
          if-no-files-found: error
          retention-days: 30

      - name: Validate published SQLite
        run: >-
          pnpm --filter @repo/parser run validate-sqlite --
          --db ../../data/sqlite/data.sqlite
          --json-out ../../release/counts.json

      - name: Upload published SQLite
        uses: actions/upload-artifact@v4
        with:
          name: baseball-stats-sqlite
          path: data/sqlite/data.sqlite
          if-no-files-found: error
          retention-days: 14

      # ここから db-latest Release の公開。artifactはretention 14日かつ匿名DLに
      # tokenが要るため、npb-analysisからの匿名取得先はRelease assetに一本化する。
      - name: Build release metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RELEASE_SCOPE: ${{ inputs.scope || 'daily' }}
        run: >-
          pnpm --filter @repo/parser run build-release-metadata --
          --counts ../../release/counts.json
          --out ../../release/metadata.json
          --source-sha "$SOURCE_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --scope "$RELEASE_SCOPE"

      - name: Compute SQLite checksum
        run: |
          set -euo pipefail
          mkdir -p release
          # sha256sumの実行ディレクトリをdata/sqliteにして、チェックサムファイルの
          # 対象名がdata.sqlite（asset名と同じ）になるようにする。
          (cd data/sqlite && sha256sum data.sqlite) > release/data.sqlite.sha256
          cat release/data.sqlite.sha256

      - name: Publish db-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="db-latest"

          players="$(jq -r '.players' release/metadata.json)"
          batting_rows="$(jq -r '.batting_rows' release/metadata.json)"
          pitching_rows="$(jq -r '.pitching_rows' release/metadata.json)"

          notes="$(cat <<NOTES
          Rolling snapshot of the published SQLite (\`data/sqlite/data.sqlite\`).
          This tag is force-updated on every publish; it does not keep history.

          - Source commit: ${SOURCE_SHA}
          - Generated by: ${RUN_URL}
          - Players: ${players}
          - Batting rows: ${batting_rows}
          - Pitching rows: ${pitching_rows}
          NOTES
          )"

          # 初回はReleaseが存在しないため、view で存在確認してcreate/editを出し分ける。
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$REPO" --target main --title "$tag" --notes "$notes"
          else
            gh release create "$tag" --repo "$REPO" --target main --title "$tag" --notes "$notes"
          fi

          # rolling tagなので既存assetを --clobber で上書きする。
          gh release upload "$tag" \
            data/sqlite/data.sqlite \
            release/data.sqlite.sha256 \
            release/metadata.json \
            --repo "$REPO" \
            --clobber

      - name: Notify npb-analysis
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NPB_ANALYSIS_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "s-yoshiki",
              repo: "npb-analysis",
              event_type: "baseball-stats-updated",
              client_payload: {
                source_repo: context.repo.owner + "/" + context.repo.repo,
                source_sha: context.sha,
                release_tag: "db-latest",
              },
            });
